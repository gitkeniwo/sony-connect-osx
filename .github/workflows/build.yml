name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Creates a GitHub Release on dispatch."
        required: true
        default: "0.1.0"

jobs:
  build:
    name: Build (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: make app

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent SonyConnect.app "SonyConnect-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SonyConnect-macos-arm64
          path: SonyConnect-macos-arm64.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" artifacts/*/*.zip --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
