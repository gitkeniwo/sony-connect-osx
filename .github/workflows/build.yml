name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-13
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: make app

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent SonyConnect.app "SonyConnect-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SonyConnect-macos-${{ matrix.arch }}
          path: SonyConnect-macos-${{ matrix.arch }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
